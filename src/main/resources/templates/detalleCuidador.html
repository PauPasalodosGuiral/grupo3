<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del cuidador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">
            <div class="display-1 mb-2">🧑‍🌾</div>
            <h1 class="text-success fw-bold mb-3" th:text="${cuidador.nombre}">Nombre</h1>
            <p class="text-muted fs-5">
                <strong>Especialidad:</strong> <span th:text="${cuidador.especialidad}">Felinos</span> <br>
                <strong>Experiencia:</strong> <span th:text="${cuidador.experiencia}">5</span> años <br>
                <strong>Tarifa:</strong> <span th:text="${cuidador.tarifa}">20.0</span> €/h
            </p>
            <hr>
            <div class="d-flex justify-content-around mt-4">
                <a href="/cuidadores" class="btn btn-outline-secondary">Volver al listado</a>
                <a th:href="@{/cuidadores/editar/{id}(id=${cuidador.id})}" class="btn btn-warning">Editar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
