<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del cuidador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="cuidadores">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales">Animales</a><a href="/habitats">Hábitats</a><a href="/cuidadores" aria-current="page">Cuidadores</a></nav>
</header>
<main class="wrap estrecho">
    <article class="ficha">
        <div class="portada">
            <h1 th:text="${cuidador.nombre}">Nombre</h1>
            <div class="sello" aria-hidden="true">🧑‍🌾</div>
        </div>
        <dl class="datos">
            <div><dt>Especialidad</dt><dd><span th:text="${cuidador.especialidad}">Felinos</span></dd></div>
            <div><dt>Experiencia</dt><dd><span th:text="${cuidador.experiencia}">5</span><small>años</small></dd></div>
            <div><dt>Tarifa</dt><dd><span th:text="${cuidador.tarifa}">20.0</span><small>€/h</small></dd></div>
        </dl>
        <div class="ficha-pie">
            <a href="/cuidadores" class="btn">Volver al listado</a>
            <a th:href="@{/cuidadores/editar/{id}(id=${cuidador.id})}" class="btn btn-solid">Editar</a>
        </div>
    </article>
</main>
</body>
</html>
