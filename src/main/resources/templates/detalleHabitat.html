<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del hábitat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="habitats">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales">Animales</a><a href="/habitats" aria-current="page">Hábitats</a><a href="/cuidadores">Cuidadores</a></nav>
</header>
<main class="wrap estrecho">
    <article class="ficha">
        <div class="portada">
            <h1 th:text="${habitat.nombre}">Nombre</h1>
            <div class="sello" aria-hidden="true">🏞️</div>
        </div>
        <dl class="datos">
            <div><dt>Clima</dt><dd><span th:text="${habitat.clima}">Tropical</span></dd></div>
            <div><dt>Altitud media</dt><dd><span th:text="${habitat.altitud_media}">500</span><small>m</small></dd></div>
            <div><dt>Temperatura media</dt><dd><span th:text="${habitat.temperatura_media}">25.0</span><small>°C</small></dd></div>
        </dl>
        <div class="ficha-pie">
            <a href="/habitats" class="btn">Volver al listado</a>
            <a th:href="@{/habitats/editar/{id}(id=${habitat.id_habitat})}" class="btn btn-solid">Editar</a>
        </div>
    </article>
</main>
</body>
</html>
