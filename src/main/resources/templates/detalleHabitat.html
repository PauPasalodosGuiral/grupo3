<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del hábitat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">
            <div class="display-1 mb-2">🏞️</div>
            <h1 class="text-success fw-bold mb-3" th:text="${habitat.nombre}">Nombre</h1>
            <p class="text-muted fs-5">
                <strong>Clima:</strong> <span th:text="${habitat.clima}">Tropical</span> <br>
                <strong>Altitud media:</strong> <span th:text="${habitat.altitud_media}">500</span> m <br>
                <strong>Temperatura media:</strong> <span th:text="${habitat.temperatura_media}">25.0</span> °C
            </p>
            <hr>
            <div class="d-flex justify-content-around mt-4">
                <a href="/habitats" class="btn btn-outline-secondary">Volver al listado</a>
                <a th:href="@{/habitats/editar/{id}(id=${habitat.id_habitat})}" class="btn btn-warning">Editar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
