<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de hábitat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="habitats">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales">Animales</a><a href="/habitats" aria-current="page">Hábitats</a><a href="/cuidadores">Cuidadores</a></nav>
</header>
<main class="wrap estrecho">
    <div class="form-caja">
        <div class="portada">
            <h1 th:text="${titulo}">Formulario de hábitat</h1>
        </div>
        <form th:action="@{/habitats/guardar}" th:object="${habitat}" method="post">
            <input type="hidden" th:field="*{id_habitat}">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" th:field="*{nombre}" required>
                </div>
                <div class="campo">
                    <label for="clima">Clima</label>
                    <input type="text" th:field="*{clima}" required>
                </div>
                <div class="campo">
                    <label for="altitud_media">Altitud media (m)</label>
                    <input type="number" th:field="*{altitud_media}" required>
                </div>
                <div class="campo">
                    <label for="temperatura_media">Temperatura media (°C)</label>
                    <input type="number" step="0.1" th:field="*{temperatura_media}" required>
                </div>

            <div class="form-acciones">
                <a href="/habitats" class="btn">Cancelar</a>
                <button type="submit" class="btn btn-solid">Guardar hábitat</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
