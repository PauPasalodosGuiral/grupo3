<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Hábitats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="habitats">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales">Animales</a><a href="/habitats" aria-current="page">Hábitats</a><a href="/cuidadores">Cuidadores</a></nav>
</header>
<main class="wrap">
    <section class="portada">
        <div>
            <h1>Catálogo de hábitats</h1>
            <p class="sub"><span th:text="${habitats.size()}">0</span> registrados</p>
        </div>
        <a href="/habitats/nuevo" class="btn btn-solid">Añadir hábitat</a>
    </section>

    <div th:if="${habitats.size() > 0}" class="tabla-caja">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Clima</th>
                <th>Altitud media</th>
                <th>Temperatura media</th>
                <th class="acciones">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="habitat : ${habitats}">
                <td th:text="${habitat.id_habitat}">1</td>
                <td th:text="${habitat.nombre}">Nombre</td>
                <td th:text="${habitat.clima}">Tropical</td>
                <td th:text="${habitat.altitud_media} + ' m'">500 m</td>
                <td th:text="${habitat.temperatura_media} + ' °C'">25 °C</td>
                <td class="acciones">
                    <a th:href="@{/habitat/{id}(id=${habitat.id_habitat})}" class="btn btn-sm btn-sec">Detalles</a>
                    <a th:href="@{/habitats/editar/{id}(id=${habitat.id_habitat})}" class="btn btn-sm">Editar</a>
                    <a th:href="@{/habitats/borrar/{id}(id=${habitat.id_habitat})}" class="btn btn-sm btn-peligro"
                       onclick="return confirm('¿Estás seguro de borrar este hábitat?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:unless="${habitats.size() > 0}" class="vacio">
        No se han encontrado hábitats registrados en el sistema.
    </div>

    <div class="pie">
        <a href="/menu.html" class="btn">Volver al menú</a>
    </div>
</main>
</body>
</html>
