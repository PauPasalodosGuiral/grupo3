<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Hábitats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-success fw-bold">🏞️ Catálogo de hábitats</h1>
        <a href="/habitats/nuevo" class="btn btn-success">Añadir nuevo hábitat</a>
    </div>

    <div th:if="${habitats.size() > 0}" class="table-responsive">
        <table class="table table-striped table-hover align-middle shadow-sm bg-white rounded">
            <thead class="table-success">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Clima</th>
                <th>Altitud media</th>
                <th>Temperatura media</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="habitat : ${habitats}">
                <td th:text="${habitat.id_habitat}">1</td>
                <td th:text="${habitat.nombre}">Sabana</td>
                <td th:text="${habitat.clima}">Tropical</td>
                <td th:text="${habitat.altitud_media} + ' m'">500 m</td>
                <td th:text="${habitat.temperatura_media} + ' °C'">25 °C</td>
                <td class="text-center">
                    <a th:href="@{/habitat/{id}(id=${habitat.id_habitat})}" class="btn btn-info btn-sm">Detalles</a>
                    <a th:href="@{/habitats/editar/{id}(id=${habitat.id_habitat})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/habitats/borrar/{id}(id=${habitat.id_habitat})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Estás seguro de borrar este hábitat?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:unless="${habitats.size() > 0}" class="alert alert-warning text-center shadow-sm">
        No se han encontrado hábitats registrados en el sistema.
    </div>

    <div class="text-start mt-4">
        <a href="/menu.html" class="btn btn-outline-secondary">Volver al menú</a>
    </div>
</div>
</body>
</html>
