<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0" th:text="${titulo}">Formulario de animal</h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/animales/guardar}" th:object="${animal}" method="post">
                <input type="hidden" th:field="*{id_animal}">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre:</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Origen:</label>
                    <input type="text" class="form-control" th:field="*{origen}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Esperanza de vida (años):</label>
                    <input type="number" min="0" class="form-control" th:field="*{esperanza_vida}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Peso medio (kg):</label>
                    <input type="number" step="0.1" min="0" class="form-control" th:field="*{peso_medio}" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/animales" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar animal</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
