<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de animal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="animales">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales" aria-current="page">Animales</a><a href="/habitats">Hábitats</a><a href="/cuidadores">Cuidadores</a></nav>
</header>
<main class="wrap estrecho">
    <div class="form-caja">
        <div class="portada">
            <h1 th:text="${titulo}">Formulario de animal</h1>
        </div>
        <form th:action="@{/animales/guardar}" th:object="${animal}" method="post">
            <input type="hidden" th:field="*{id_animal}">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" th:field="*{nombre}" required>
                </div>
                <div class="campo">
                    <label for="origen">Origen</label>
                    <input type="text" th:field="*{origen}" required>
                </div>
                <div class="campo">
                    <label for="esperanza_vida">Esperanza de vida (años)</label>
                    <input type="number" min="0" th:field="*{esperanza_vida}" required>
                </div>
                <div class="campo">
                    <label for="peso_medio">Peso medio (kg)</label>
                    <input type="number" step="0.1" min="0" th:field="*{peso_medio}" required>
                </div>

            <div class="form-acciones">
                <a href="/animales" class="btn">Cancelar</a>
                <button type="submit" class="btn btn-solid">Guardar animal</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
