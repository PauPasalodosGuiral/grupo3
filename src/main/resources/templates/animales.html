<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Animales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="animales">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales" aria-current="page">Animales</a><a href="/habitats">Hábitats</a><a href="/cuidadores">Cuidadores</a></nav>
</header>
<main class="wrap">
    <section class="portada">
        <div>
            <h1>Catálogo de animales</h1>
            <p class="sub"><span th:text="${animales.size()}">0</span> registrados</p>
        </div>
        <a href="/animales/nuevo" class="btn btn-solid">Añadir animal</a>
    </section>

    <div th:if="${animales.size() > 0}" class="tabla-caja">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Origen</th>
                <th>Esperanza de vida</th>
                <th>Peso medio</th>
                <th class="acciones">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="animal : ${animales}">
                <td th:text="${animal.id_animal}">1</td>
                <td th:text="${animal.nombre}">Nombre</td>
                <td th:text="${animal.origen}">España</td>
                <td th:text="${animal.esperanza_vida} + ' años'">12 años</td>
                <td th:text="${animal.peso_medio} + ' kg'">35 kg</td>
                <td class="acciones">
                    <a th:href="@{/animal/{id}(id=${animal.id_animal})}" class="btn btn-sm btn-sec">Detalles</a>
                    <a th:href="@{/animales/editar/{id}(id=${animal.id_animal})}" class="btn btn-sm">Editar</a>
                    <a th:href="@{/animales/borrar/{id}(id=${animal.id_animal})}" class="btn btn-sm btn-peligro"
                       onclick="return confirm('¿Estás seguro de borrar este animal?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:unless="${animales.size() > 0}" class="vacio">
        No se han encontrado animales registrados en el sistema.
    </div>

    <div class="pie">
        <a href="/menu.html" class="btn">Volver al menú</a>
    </div>
</main>
</body>
</html>
