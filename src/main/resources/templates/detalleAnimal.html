<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del animal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="animales">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales" aria-current="page">Animales</a><a href="/habitats">Hábitats</a><a href="/cuidadores">Cuidadores</a></nav>
</header>
<main class="wrap estrecho">
    <article class="ficha">
        <div class="portada">
            <h1 th:text="${animal.nombre}">Nombre</h1>
            <div class="sello" aria-hidden="true">🐾</div>
        </div>
        <dl class="datos">
            <div><dt>Origen</dt><dd><span th:text="${animal.origen}">España</span></dd></div>
            <div><dt>Esperanza de vida</dt><dd><span th:text="${animal.esperanza_vida}">12</span><small>años</small></dd></div>
            <div><dt>Peso medio</dt><dd><span th:text="${animal.peso_medio}">35.0</span><small>kg</small></dd></div>
        </dl>
        <div class="ficha-pie">
            <a href="/animales" class="btn">Volver al listado</a>
            <a th:href="@{/animales/editar/{id}(id=${animal.id_animal})}" class="btn btn-solid">Editar</a>
        </div>
    </article>
</main>
</body>
</html>
