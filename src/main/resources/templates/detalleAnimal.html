<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">
            <div class="display-1 mb-2">🐾</div>
            <h1 class="text-success fw-bold mb-3" th:text="${animal.nombre}">Nombre</h1>
            <p class="text-muted fs-5">
                <strong>Origen:</strong> <span th:text="${animal.origen}">España</span> <br>
                <strong>Esperanza de vida:</strong> <span th:text="${animal.esperanza_vida}">12</span> años <br>
                <strong>Peso medio:</strong> <span th:text="${animal.peso_medio}">35.0</span> kg
            </p>
            <hr>
            <div class="d-flex justify-content-around mt-4">
                <a href="/animales" class="btn btn-outline-secondary">Volver al listado</a>
                <a th:href="@{/animales/editar/{id}(id=${animal.id_animal})}" class="btn btn-warning">Editar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
