<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Cuidadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-success fw-bold">🧑‍🌾 Catálogo de cuidadores</h1>
        <a href="/cuidadores/nuevo" class="btn btn-success">Añadir nuevo cuidador</a>
    </div>

    <div th:if="${cuidadores.size() > 0}" class="table-responsive">
        <table class="table table-striped table-hover align-middle shadow-sm bg-white rounded">
            <thead class="table-success">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Experiencia</th>
                <th>Tarifa</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cuidador : ${cuidadores}">
                <td th:text="${cuidador.id}">1</td>
                <td th:text="${cuidador.nombre}">Ana</td>
                <td th:text="${cuidador.especialidad}">Felinos</td>
                <td th:text="${cuidador.experiencia} + ' años'">5 años</td>
                <td th:text="${cuidador.tarifa} + ' €/h'">20 €/h</td>
                <td class="text-center">
                    <a th:href="@{/cuidador/{id}(id=${cuidador.id})}" class="btn btn-info btn-sm">Detalles</a>
                    <a th:href="@{/cuidadores/editar/{id}(id=${cuidador.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/cuidadores/borrar/{id}(id=${cuidador.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Estás seguro de borrar este cuidador?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:unless="${cuidadores.size() > 0}" class="alert alert-warning text-center shadow-sm">
        No se han encontrado cuidadores registrados en el sistema.
    </div>

    <div class="text-start mt-4">
        <a href="/menu.html" class="btn btn-outline-secondary">Volver al menú</a>
    </div>
</div>
</body>
</html>
