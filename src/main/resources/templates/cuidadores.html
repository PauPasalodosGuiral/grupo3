<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cuidadores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="cuidadores">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales">Animales</a><a href="/habitats">Hábitats</a><a href="/cuidadores" aria-current="page">Cuidadores</a></nav>
</header>
<main class="wrap">
    <section class="portada">
        <div>
            <h1>Catálogo de cuidadores</h1>
            <p class="sub"><span th:text="${cuidadores.size()}">0</span> registrados</p>
        </div>
        <a href="/cuidadores/nuevo" class="btn btn-solid">Añadir cuidador</a>
    </section>

    <div th:if="${cuidadores.size() > 0}" class="tabla-caja">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Experiencia</th>
                <th>Tarifa</th>
                <th class="acciones">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cuidador : ${cuidadores}">
                <td th:text="${cuidador.id}">1</td>
                <td th:text="${cuidador.nombre}">Nombre</td>
                <td th:text="${cuidador.especialidad}">Felinos</td>
                <td th:text="${cuidador.experiencia} + ' años'">5 años</td>
                <td th:text="${cuidador.tarifa} + ' €/h'">20 €/h</td>
                <td class="acciones">
                    <a th:href="@{/cuidador/{id}(id=${cuidador.id})}" class="btn btn-sm btn-sec">Detalles</a>
                    <a th:href="@{/cuidadores/editar/{id}(id=${cuidador.id})}" class="btn btn-sm">Editar</a>
                    <a th:href="@{/cuidadores/borrar/{id}(id=${cuidador.id})}" class="btn btn-sm btn-peligro"
                       onclick="return confirm('¿Estás seguro de borrar este cuidador?')">Borrar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:unless="${cuidadores.size() > 0}" class="vacio">
        No se han encontrado cuidadores registrados en el sistema.
    </div>

    <div class="pie">
        <a href="/menu.html" class="btn">Volver al menú</a>
    </div>
</main>
</body>
</html>
