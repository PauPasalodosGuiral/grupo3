<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de cuidador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,700..800,75..100&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/fauna.css}">
</head>
<body data-sec="cuidadores">
<header class="bar">
    <a class="logo" href="/">Fauna</a>
    <nav aria-label="Secciones"><a href="/animales">Animales</a><a href="/habitats">Hábitats</a><a href="/cuidadores" aria-current="page">Cuidadores</a></nav>
</header>
<main class="wrap estrecho">
    <div class="form-caja">
        <div class="portada">
            <h1 th:text="${titulo}">Formulario de cuidador</h1>
        </div>
        <form th:action="@{/cuidadores/guardar}" th:object="${cuidador}" method="post">
            <input type="hidden" th:field="*{id}">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" th:field="*{nombre}" required>
                </div>
                <div class="campo">
                    <label for="especialidad">Especialidad</label>
                    <input type="text" th:field="*{especialidad}" required>
                </div>
                <div class="campo">
                    <label for="experiencia">Experiencia (años)</label>
                    <input type="number" min="0" th:field="*{experiencia}" required>
                </div>
                <div class="campo">
                    <label for="tarifa">Tarifa (€/h)</label>
                    <input type="number" step="0.01" min="0" th:field="*{tarifa}" required>
                </div>

            <div class="form-acciones">
                <a href="/cuidadores" class="btn">Cancelar</a>
                <button type="submit" class="btn btn-solid">Guardar cuidador</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
